<style>

    display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;
    -webkit-font-smoothing:antialiased;vertical-align:middle;
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
  .msi.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

    --ok:#4c8c5c; --warn:#c98a1a; --danger:#c14a4a;

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;

    padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer}

  .event-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

  .event-row .memo{font-size:14px;color:var(--ink);margin-top:2px;display:flex;align-items:center;gap:4px}
  .event-row .memo .msi{font-size:16px;color:var(--ink-dim)}
  .event-row.cancelled{opacity:.5}
  .event-row.cancelled .name{text-decoration:line-through}
  .section-title{font-size:13px;color:var(--ink-dim);margin:18px 4px 6px;font-weight:600}
  nav.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--safe-b));
    padding-bottom:var(--safe-b);background:var(--card);border-top:1px solid var(--line);
    display:flex;z-index:20}
  nav.tabbar[hidden]{display:none}
  body.in-event{padding-bottom:calc(var(--tab-h) + var(--safe-b) + 12px)}
  body:not(.in-event) .tabbar{display:none}
  nav.tabbar button{flex:1;border:none;background:none;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-dim);
    cursor:pointer;font-family:inherit}
  nav.tabbar button.active{color:var(--accent);font-weight:700}
  nav.tabbar button .msi{font-size:21px}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;
    justify-content:center;z-index:30}
  .drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;
    opacity:0;pointer-events:none;transition:opacity .22s}
  .drawer-mask.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:86%;max-width:340px;background:var(--card);
    box-shadow:2px 0 24px rgba(0,0,0,.18);transform:translateX(-100%);transition:transform .25s;
    overflow-y:auto;padding:16px calc(16px) calc(16px + var(--safe-b))}
  .drawer-mask.show .drawer{transform:translateX(0)}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .drawer-head .title{font-weight:800;font-size:18px}
  .modal{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;

  .field{margin-bottom:12px}

  .row{display:flex;gap:8px}
  .row > *{flex:1;min-width:0}

  .toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);transform:translateX(-50%);

  .claim-row .qty{font-size:13px;color:var(--ink-dim);white-space:nowrap;flex:0 0 auto}
  .claim-row .qtyEditBtn{flex:0 0 auto}
  .statusicon{font-size:26px;flex:0 0 auto}
  .statusicon.full{color:var(--ok)}
  .statusicon.partial{color:var(--warn)}
  .statusicon.none{color:var(--ink-dim)}
  .summary-bar{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-dim);

  .fam-picker label.opt{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:15px}
  .fam-picker label.opt:last-child{border-bottom:none}
  .maplink{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;
    background:#f6f1e9;border-radius:10px;font-size:14px;color:var(--ink);text-decoration:none}
  .maplink span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .maplink .msi:last-child{color:var(--accent)}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .menu-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;

function toast(msg){

  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"), 2200);

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- 一次性資料初始化：歷年資料 + 2026 模板 ----------
async function ensureSeedData(){
  const snap = await getDocs(collection(db,"events"));
  if(!snap.empty) return; // 已經有資料就不重複匯入

  const batch = writeBatch(db);
  for(const e of HISTORY_SEED){
    const ref = doc(collection(db,"events"));
    batch.set(ref, {
      seq: e.seq, year: e.year, title: `第${e.seq ?? "-"}屆烤肉聚會`,
      date: null, checkIn: null, checkOut: null,
      region: e.region, host: e.host, memo: e.memo,
      cancelled: !!e.cancelled,
      venue: {name: e.venueName, address:"", phone:"", mapUrl:"", notes:""},
      schedule: [], splitMode: "perHead", kidFixedFee: 0,
      status: e.year < 2026 ? "done" : "planning",
      createdAt: serverTimestamp(),
    });
  }
  await batch.commit();

  // 2026 事件建好之後，補建它的類別/項目模板
  const evSnap = await getDocs(query(collection(db,"events")));
  const ev2026 = evSnap.docs.find(d => d.data().year === 2026);
  if(ev2026){
    const b2 = writeBatch(db);
    BBQ_TEMPLATE.categories.forEach((cat, ci)=>{
      const catRef = doc(collection(db, `events/${ev2026.id}/categories`));
      b2.set(catRef, {name: cat.name, order: ci});
      cat.items.forEach((it, ii)=>{
        const itemRef = doc(collection(db, `events/${ev2026.id}/items`));
        b2.set(itemRef, {
          categoryId: catRef.id, name: it.name, unit: it.unit,
          qtyNeeded: it.qtyFixed ?? 1, note: "", order: ii
        });
      });
    });
    await b2.commit();
  }
  toast("已匯入歷年資料與 2026 模板");
}

let currentEvent = null;

let families = [], categories = [], items = [], claims = [], expenses = [];
let claimFilter = "all";
let categoryFilter = "all";
let unsubs = [];

function clearUnsubs(){ unsubs.forEach(u=>u()); unsubs = []; }

function enterEvent(e){
  currentEvent = e;
  currentTab = "overview";
  claimFilter = "all";
  document.body.classList.add("in-event");
  tabbar.hidden = false;
  backBtn.hidden = false;
  topTitle.textContent = `${e.year} ${e.venue?.name || ""}`;
  highlightTab();
  updateBackBtn();
  clearUnsubs();
  unsubs.push(onSnapshot(collection(db, `events/${e.id}/families`), snap=>{
    families = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentTab==="overview" || currentTab==="families" || currentTab==="claims" || currentTab==="mine") renderActiveTab();
  }));
  unsubs.push(onSnapshot(query(collection(db, `events/${e.id}/categories`), orderBy("order")), snap=>{
    categories = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentTab==="claims") renderActiveTab();
  }));
  unsubs.push(onSnapshot(query(collection(db, `events/${e.id}/items`), orderBy("order")), snap=>{
    items = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentTab==="overview" || currentTab==="claims" || currentTab==="mine") renderActiveTab();
  }));
  unsubs.push(onSnapshot(collection(db, `events/${e.id}/claims`), snap=>{
    claims = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentTab==="overview" || currentTab==="claims" || currentTab==="mine") renderActiveTab();
  }));
  unsubs.push(onSnapshot(collection(db, `events/${e.id}/expenses`), snap=>{
    expenses = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentTab==="overview" || currentTab==="expenses" || currentTab==="settle") renderActiveTab();
  }));
  renderActiveTab();
}

// ---------- 4.4 清單認領 ----------
function renderClaimsTab(){
  const mine = myFamilyInEvent();
  const famName = id => families.find(f=>f.id===id)?.name || "?";

  const withClaims = items.map(it=>{
    const itClaims = claims.filter(c=>c.itemId===it.id);
    const claimedQty = itClaims.reduce((s,c)=>s+(Number(c.qty)||0),0);
    return {...it, itClaims, claimedQty, remaining: Math.max(0,(it.qtyNeeded||0)-claimedQty)};
  });

  const filtered = withClaims.filter(it=>{
    if(categoryFilter!=="all" && it.categoryId!==categoryFilter) return false;
    if(claimFilter==="need") return it.remaining>0;
    if(claimFilter==="mine") return mine && it.itClaims.some(c=>c.familyId===mine.id);
    return true;
  });

  const fullCount = withClaims.filter(it=>it.remaining<=0 && it.claimedQty>0).length;
  const needCount = withClaims.filter(it=>it.remaining>0).length;

  const byCat = {};
  filtered.forEach(it=>{ (byCat[it.categoryId] ??= []).push(it); });

  const catBlocks = categories
    .filter(c=> byCat[c.id]?.length)
    .map(c=>{
      const rows = byCat[c.id].map(it=>{

// 點一下直接認領／取消認領（大部分項目需求量都是1，不用每次都跳數量視窗）
async function toggleClaim(item, fam){
  const itClaims = claims.filter(c=>c.itemId===item.id);
  const mineClaim = itClaims.find(c=>c.familyId===fam.id);
  if(mineClaim){
    await deleteDoc(doc(db, `events/${currentEvent.id}/claims/${mineClaim.id}`));
    toast("已取消認領");
    return;
  }
  const claimedQty = itClaims.reduce((s,c)=>s+(Number(c.qty)||0),0);
  const remaining = Math.max(0, (item.qtyNeeded||0) - claimedQty);
  const qty = remaining>0 ? remaining : 1;
  await addDoc(collection(db, `events/${currentEvent.id}/claims`), {
    itemId: item.id, familyId: fam.id, qty, done:false, createdAt: serverTimestamp()
  });
  toast(remaining>0 ? "已認領 ×"+qty : "已超量認領，還是幫你記錄了");
}

function openClaimModal(item, fam){
  const itClaims = claims.filter(c=>c.itemId===item.id);
  const claimedQty = itClaims.reduce((s,c)=>s+(Number(c.qty)||0),0);
  const mineClaim = itClaims.find(c=>c.familyId===fam.id);
  const othersQty = claimedQty - (mineClaim ? Number(mineClaim.qty)||0 : 0);
  const remaining = Math.max(0, (item.qtyNeeded||0) - othersQty);
  const defaultQty = mineClaim ? mineClaim.qty : (remaining>0 ? remaining : 1);

  const state = { qty: defaultQty };
  root_showModal(`
    <h3>${esc(item.name)}</h3>
    <div style="font-size:13px;color:var(--ink-dim);margin-bottom:10px">需要 ${item.qtyNeeded} ${esc(item.unit||"")}，目前已認領 ${claimedQty}</div>
    <div class="field"><label>我認領（${esc(item.unit||"")}）</label>
      <div class="stepper" data-key="qty">
        <button type="button" class="stepbtn minus">－</button>
        <span class="stepval">${state.qty}</span>
        <button type="button" class="stepbtn plus">＋</button>
      </div>
    </div>
    <div class="row">
      <button class="btn block" id="saveClaim">${mineClaim ? "更新" : "確定認領"}</button>
      ${mineClaim ? `<button class="btn secondary block" id="cancelClaim">取消認領</button>` : ""}
    </div>
  `);
  const qtyStepper = modalMask.querySelector(".stepper");
  const qtyValEl = qtyStepper.querySelector(".stepval");
  qtyStepper.querySelector(".minus").onclick = ()=>{ state.qty = Math.max(0, state.qty-1); qtyValEl.textContent = state.qty; };
  qtyStepper.querySelector(".plus").onclick = ()=>{ state.qty = Math.min(99, state.qty+1); qtyValEl.textContent = state.qty; };
  document.getElementById("saveClaim").onclick = async ()=>{
    const qty = state.qty;
    if(!qty || qty<=0){ toast("數量至少要 1"); return; }
    if(othersQty + qty > item.qtyNeeded) toast("超過需求量了，還是先幫你記錄");
    if(mineClaim){
      await updateDoc(doc(db, `events/${currentEvent.id}/claims/${mineClaim.id}`), {qty});
    } else {
      await addDoc(collection(db, `events/${currentEvent.id}/claims`), {
        itemId: item.id, familyId: fam.id, qty, done:false, createdAt: serverTimestamp()
      });
    }
    toast("已認領"); closeModal();
  };
  if(mineClaim){
    document.getElementById("cancelClaim").onclick = async ()=>{
      await deleteDoc(doc(db, `events/${currentEvent.id}/claims/${mineClaim.id}`));
      toast("已取消認領"); closeModal();
    };
  }
}

// ---------- 4.7 結算 ----------
// 用最大餘數法把總額依權重整數分配，讓總和不會因四捨五入而兜不攏
function allocateByWeight(total, weights){
  const totalWeight = weights.reduce((a,b)=>a+b,0);
  if(totalWeight <= 0) return weights.map(()=>0);
  const raw = weights.map(w => total * w / totalWeight);
  const floors = raw.map(Math.floor);
  const remainder = total - floors.reduce((a,b)=>a+b,0);
  const order = raw.map((v,i)=>({i, frac: v-Math.floor(v)})).sort((a,b)=>b.frac-a.frac);
  const result = [...floors];
  for(let k=0; k<remainder; k++){ result[order[k].i] += 1; }
  return result;
}

function computeSettlement(){
  const splitMode = currentEvent.splitMode || "perHead";
  const kidFixedFee = Number(currentEvent.kidFixedFee) || 0;
  const foodTotal = expenses.filter(x=>x.kind==="food").reduce((s,x)=>s+(Number(x.amount)||0),0);
  const roomTotal = expenses.filter(x=>x.kind==="room").reduce((s,x)=>s+(Number(x.amount)||0),0);

  const foodShare = {};
  if(splitMode === "perFamily"){
    const weights = families.map(()=>1);
    const allocated = allocateByWeight(foodTotal, weights);
    families.forEach((f,i)=>{ foodShare[f.id] = allocated[i]; });
  } else if(splitMode === "perHeadKidFixed"){
    const totalKids = families.reduce((s,f)=>s+(Number(f.kids)||0),0);
    const remainForAdults = Math.max(0, foodTotal - totalKids*kidFixedFee);
    const adultWeights = families.map(f=> Number(f.adults)||0);
    const adultAllocated = allocateByWeight(remainForAdults, adultWeights);
    families.forEach((f,i)=>{ foodShare[f.id] = (Number(f.kids)||0)*kidFixedFee + adultAllocated[i]; });
  } else {
    const weightFn = f => splitMode==="perHeadKidHalf" ? (Number(f.adults)||0) + (Number(f.kids)||0)*0.5
                         : splitMode==="perHeadKidFree" ? (Number(f.adults)||0)
                         : (Number(f.adults)||0) + (Number(f.kids)||0); // perHead
    const weights = families.map(weightFn);
    const allocated = allocateByWeight(foodTotal, weights);
    families.forEach((f,i)=>{ foodShare[f.id] = allocated[i]; });
  }

  const result = families.map(f=>{
    const foodPaid = expenses.filter(x=>x.kind==="food" && x.familyId===f.id).reduce((s,x)=>s+(Number(x.amount)||0),0);
    const roomPaid = expenses.filter(x=>x.kind==="room" && x.familyId===f.id).reduce((s,x)=>s+(Number(x.amount)||0),0);
    const foodOwed = foodShare[f.id] || 0;
    const roomOwed = Number(f.roomFee) || 0;
    return {
      family: f, foodOwed, foodPaid, foodNet: foodPaid-foodOwed,
      roomOwed, roomPaid, roomNet: roomPaid-roomOwed,
      totalNet: (foodPaid-foodOwed) + (roomPaid-roomOwed)
    };
  });
  return {result, foodTotal, roomTotal};
}

// 貪心配對最大應收／應付，湊出「A轉給B多少」的最少筆數方案
function minimizeTransfers(balances){
  const creditors = balances.filter(b=>b.amount>0.5).map(b=>({...b})).sort((a,b)=>b.amount-a.amount);
  const debtors = balances.filter(b=>b.amount<-0.5).map(b=>({name:b.name, amount:-b.amount})).sort((a,b)=>b.amount-a.amount);
  const transfers = [];
  let i=0, j=0;
  while(i<debtors.length && j<creditors.length){
    const pay = Math.min(debtors[i].amount, creditors[j].amount);
    if(pay > 0.5) transfers.push({from: debtors[i].name, to: creditors[j].name, amount: Math.round(pay)});
    debtors[i].amount -= pay; creditors[j].amount -= pay;
    if(debtors[i].amount < 0.5) i++;
    if(creditors[j].amount < 0.5) j++;
  }
  return transfers;
}

function renderSettleTab(){
  const {result, foodTotal, roomTotal} = computeSettlement();

  function table(title, ownedKey, paidKey, netKey){
    const rows = result.map(r=>`
      <div class="list-row">
        <div class="info"><div class="n">${esc(r.family.name)}</div>
          <div class="d">應付 $${r[ownedKey]}・已付 $${r[paidKey]}</div>
        </div>
        <div style="font-weight:700;color:${r[netKey]>=0?"var(--ok)":"var(--danger)"}">${r[netKey]>=0?"+":""}${r[netKey]}</div>
      </div>`).join("");
    return `<div class="cat-title">${title}</div><div class="card" style="padding:4px 10px">${rows}</div>`;
  }

  const totalRows = result.map(r=>`
    <div class="list-row">
      <div class="info"><div class="n">${esc(r.family.name)}</div></div>
      <div style="font-weight:700;color:${r.totalNet>=0?"var(--ok)":"var(--danger)"}">${r.totalNet>=0?"+":""}${r.totalNet}</div>
    </div>`).join("");

  const transfers = minimizeTransfers(result.map(r=>({name:r.family.name, amount:r.totalNet})));
  const anyDebt = result.some(r=> r.totalNet < -0.5);
  const anyCredit = result.some(r=> r.totalNet > 0.5);
  const transferEmptyMsg = (anyDebt && !anyCredit)
    ? "還沒有人代墊，暫時算不出轉帳對象"
    : "已經打平，不用轉帳";
  const transferHtml = transfers.length
    ? transfers.map(t=>`<div class="list-row"><div class="info"><div class="n">${esc(t.from)} → ${esc(t.to)}</div></div><div style="font-weight:700">$${t.amount}</div></div>`).join("")
    : `<div class="empty" style="padding:12px 0">${transferEmptyMsg}</div>`;

  root.innerHTML = `
    <div class="summary-bar"><span>食材設備共 $${foodTotal}</span><span>房費共 $${roomTotal}</span></div>
    ${table("食材設備", "foodOwed", "foodPaid", "foodNet")}
    ${table("房費", "roomOwed", "roomPaid", "roomNet")}
    <div class="cat-title">合計（正＝要收，負＝要付）</div>
    <div class="card" style="padding:4px 10px">${totalRows}</div>
    <div class="cat-title">最少轉帳方案</div>
    <div class="card" style="padding:4px 10px">${transferHtml}</div>
    <button class="btn secondary block" id="copySettleBtn" style="margin-top:12px">
      <span class="msi" style="font-size:18px">content_copy</span> 複製結算文字
    </button>
  `;
  document.getElementById("copySettleBtn").onclick = ()=> copySettleAsText(result, transfers, foodTotal, roomTotal);
}

function copySettleAsText(result, transfers, foodTotal, roomTotal){
  let text = `${currentEvent.year} ${currentEvent.venue?.name||""} 結算\n食材設備共 $${foodTotal}・房費共 $${roomTotal}\n\n`;
  result.forEach(r=>{ text += `${r.family.name}：${r.totalNet>=0?"+":""}${r.totalNet}\n`; });
  text += `\n轉帳方案：\n`;
  text += transfers.length ? transfers.map(t=>`${t.from} → ${t.to}：$${t.amount}`).join("\n") : "已經打平，不用轉帳";
  navigator.clipboard.writeText(text)
    .then(()=> toast("已複製到剪貼簿"))
    .catch(()=> toast("複製失敗，請手動選取"));
}

let modalMask;
function root_showModal(innerHtml){
  closeModal();
  modalMask = document.createElement("div");
  modalMask.className = "modal-mask";
  modalMask.innerHTML = `<div class="modal">${innerHtml}</div>`;
  modalMask.addEventListener("click", (ev)=>{ if(ev.target===modalMask) closeModal(); });
  document.body.appendChild(modalMask);
}
function closeModal(){ if(modalMask){ modalMask.remove(); modalMask=null; } }

// ---------- 啟動 ----------
let allEvents = [];
let autoEntered = false;
function boot(){
  updateMeBadge();

  onSnapshot(query(collection(db,"events")), (snap)=>{
    allEvents = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(!currentEvent){
      // 打開網站直接進今年的活動，省掉「先點一次才開始」這步；
      // 只在第一次載入時自動導向一次就好
      if(!autoEntered){
        autoEntered = true;
        const featured = [...allEvents].sort((a,b)=>(b.year||0)-(a.year||0)).find(e=>e.status==="planning" && !e.cancelled);
        if(featured){ enterEvent(featured); return; }
      }
      renderEventList(allEvents);
    } else {
      const updated = allEvents.find(e=>e.id===currentEvent.id);
      if(updated){
        currentEvent = updated;
        topTitle.textContent = `${updated.year} ${updated.venue?.name || ""}`;
        if(currentTab==="overview") renderActiveTab();
      }
    }
  }, (err)=>{
    console.error(err);
    root.innerHTML = `<div class="empty">讀取失敗，可能是 Firestore 權限規則尚未開放。<br/>
      <span style="font-size:12px">${err.message}</span></div>`;
  });
}
boot();
</script>

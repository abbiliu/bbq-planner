<style>

    -webkit-font-smoothing:antialiased;vertical-align:middle;

    --bg:#faf7f2; --card:#ffffff; --ink:#2b2420; --ink-dim:#8a8078;

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);

    padding-bottom:calc(var(--tab-h) + var(--safe-b) + 12px);}
  a{color:inherit}
  header.topbar{position:sticky;top:0;z-index:10;background:rgba(250,247,242,.92);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
    padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  header.topbar .title{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header.topbar .me{font-size:12px;color:var(--ink-dim);border:1px solid var(--line);

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;
    padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
  .btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn.block{width:100%}
  .event-row{display:flex;flex-direction:column;gap:4px;padding:14px 4px;border-bottom:1px solid var(--line)}

  .event-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .event-row .seq{font-size:12px;color:var(--ink-dim)}

  .event-row .meta{font-size:13px;color:var(--ink-dim)}

    align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink-dim);

// ---------- 小工具 ----------
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"), 2200);
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- 一次性資料初始化：歷年資料 + 2026 模板 ----------
async function ensureSeedData(){
  const snap = await getDocs(collection(db,"events"));
  if(!snap.empty) return; // 已經有資料就不重複匯入

  const batch = writeBatch(db);
  for(const e of HISTORY_SEED){
    const ref = doc(collection(db,"events"));
    batch.set(ref, {
      seq: e.seq, year: e.year, title: `第${e.seq ?? "-"}屆烤肉聚會`,
      date: null, checkIn: null, checkOut: null,
      region: e.region, host: e.host, memo: e.memo,
      cancelled: !!e.cancelled,
      venue: {name: e.venueName, address:"", phone:"", mapUrl:"", notes:""},
      schedule: [], splitMode: "perHead", kidFixedFee: 0,
      status: e.year < 2026 ? "done" : "planning",
      createdAt: serverTimestamp(),
    });
  }
  await batch.commit();

  // 2026 事件建好之後，補建它的類別/項目模板
  const evSnap = await getDocs(query(collection(db,"events")));
  const ev2026 = evSnap.docs.find(d => d.data().year === 2026);
  if(ev2026){
    const b2 = writeBatch(db);
    BBQ_TEMPLATE.categories.forEach((cat, ci)=>{
      const catRef = doc(collection(db, `events/${ev2026.id}/categories`));
      b2.set(catRef, {name: cat.name, order: ci});
      cat.items.forEach((it, ii)=>{
        const itemRef = doc(collection(db, `events/${ev2026.id}/items`));
        b2.set(itemRef, {
          categoryId: catRef.id, name: it.name, unit: it.unit,
          qtyNeeded: it.qtyFixed ?? 1, note: "", order: ii
        });
      });
    });
    await b2.commit();
  }
  toast("已匯入歷年資料與 2026 模板");
}

// ---------- 首頁／活動列表 ----------
function renderEventList(events){
  if(events.length === 0){
    root.innerHTML = `<div class="empty">還沒有任何活動<br/><br/>
      <button class="btn" id="btnSeed">匯入歷年資料 + 2026 模板</button></div>`;
    document.getElementById("btnSeed").onclick = async ()=>{
      root.innerHTML = `<div class="empty">匯入中…</div>`;
      await ensureSeedData();
    };
    return;
  }

  const sorted = [...events].sort((a,b)=> (b.year||0) - (a.year||0));
  const rows = sorted.map(e=>{
    const seqLabel = e.cancelled ? "停辦" : (e.seq ? `第 ${e.seq} 屆` : "");
    const metaParts = [e.region, e.venue?.name].filter(Boolean);
    return `<div class="event-row ${e.cancelled?"cancelled":""}" data-id="${e.id}">
      <div class="top">
        <span class="name">${e.year} ${e.venue?.name ? "・"+e.venue.name : ""}</span>
        <span class="seq pill">${seqLabel}</span>
      </div>
      <div class="meta">${metaParts.join("　")}${e.host ? "　主辦："+e.host : ""}</div>
      ${e.memo ? `<div class="memo"><span class="msi" style="font-size:15px">chat_bubble</span> ${e.memo}</div>` : ""}
    </div>`;
  }).join("");

  const doneCount = sorted.filter(e=>!e.cancelled && e.seq).length;
  root.innerHTML = `
    <div class="card">
      <div style="font-weight:700;margin-bottom:4px">歷年紀錄</div>
      <div style="font-size:12px;color:var(--ink-dim)">辦過 ${doneCount} 屆</div>
      <div class="stat-grid">
        <div class="stat"><div class="num">${doneCount}</div><div class="lbl">屆數</div></div>
        <div class="stat"><div class="num">${new Set(sorted.map(e=>e.region).filter(Boolean)).size}</div><div class="lbl">去過地區</div></div>
        <div class="stat"><div class="num">${new Set(sorted.map(e=>e.host).filter(Boolean)).size}</div><div class="lbl">主辦人數</div></div>
      </div>
    </div>
    <div class="card" style="padding:4px 10px">${rows}</div>
    <button class="btn block" id="btnNewEvent"><span class="msi" style="font-size:18px">add</span> 新增活動</button>
  `;

  root.querySelectorAll(".event-row").forEach(row=>{
    row.addEventListener("click", ()=> openEventDetail(row.dataset.id));
  });
  document.getElementById("btnNewEvent").onclick = ()=> toast("新增活動功能下一階段實作");
}

// 2026 起才有完整清單／認領／費用；更早的年份只開記憶點小卡
function openEventDetail(id){
  const e = allEvents.find(x=>x.id===id);
  if(!e) return;
  if(e.year >= 2026){ enterEvent(e); return; }
  root_showModal(`
    <h3>${e.year}　${e.venue?.name||""}</h3>
    <div class="field"><label>場次</label>${e.seq ? "第"+e.seq+"屆" : (e.cancelled?"停辦":"—")}</div>
    <div class="field"><label>區域</label>${e.region||"—"}</div>
    <div class="field"><label>主辦人</label>${e.host||"—"}</div>
    <div class="field"><label>記憶點</label><textarea id="memoInput" rows="2">${e.memo||""}</textarea></div>
    <button class="btn block" id="saveMemo">儲存記憶點</button>
  `);
  document.getElementById("saveMemo").onclick = async ()=>{
    const val = document.getElementById("memoInput").value;
    await updateDoc(doc(db,"events",id), {memo: val});
    toast("已儲存"); closeModal();
  };
}

// ==================== 活動工作區（4.2起，含分頁） ====================
let currentEvent = null;
let currentTab = "overview";
let families = [], categories = [], items = [], claims = [];
let claimFilter = "all";
let unsubs = [];

function clearUnsubs(){ unsubs.forEach(u=>u()); unsubs = []; }

function enterEvent(e){
  currentEvent = e;
  currentTab = "overview";
  claimFilter = "all";
  document.body.classList.add("in-event");
  tabbar.hidden = false;
  backBtn.hidden = false;
  topTitle.textContent = `${e.year} ${e.venue?.name || ""}`;
  highlightTab();
  clearUnsubs();
  unsubs.push(onSnapshot(collection(db, `events/${e.id}/families`), snap=>{
    families = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentTab==="overview" || currentTab==="claims") renderActiveTab();
  }));
  unsubs.push(onSnapshot(query(collection(db, `events/${e.id}/categories`), orderBy("order")), snap=>{
    categories = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentTab==="claims") renderActiveTab();
  }));
  unsubs.push(onSnapshot(query(collection(db, `events/${e.id}/items`), orderBy("order")), snap=>{
    items = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentTab==="claims") renderActiveTab();
  }));
  unsubs.push(onSnapshot(collection(db, `events/${e.id}/claims`), snap=>{
    claims = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(currentTab==="claims") renderActiveTab();
  }));
  renderActiveTab();
}

function exitEvent(){
  clearUnsubs();
  currentEvent = null;
  document.body.classList.remove("in-event");
  tabbar.hidden = true;
  backBtn.hidden = true;
  topTitle.textContent = "年度烤肉聚會";
  renderEventList(allEvents);
}
backBtn.onclick = exitEvent;

tabbar.querySelectorAll("button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentTab = btn.dataset.tab;
    highlightTab();
    renderActiveTab();
  });
});
function highlightTab(){
  tabbar.querySelectorAll("button").forEach(b=> b.classList.toggle("active", b.dataset.tab===currentTab));
}
function renderActiveTab(){
  if(!currentEvent) return;
  if(currentTab==="overview") renderOverviewTab();
  else if(currentTab==="claims") renderClaimsTab();
  else root.innerHTML = `<div class="empty">這個分頁下一階段實作</div>`;
}

// ---------- 4.2＋4.3 總覽（活動資訊 + 家庭名單） ----------
function renderOverviewTab(){
  const e = currentEvent;
  const totals = families.reduce((a,f)=>{
    a.adults += Number(f.adults)||0; a.kids += Number(f.kids)||0; a.pets += Number(f.pets)||0; return a;
  }, {adults:0, kids:0, pets:0});

  const famRows = families.map(f=>`
    <div class="list-row">
      <div class="info">
        <div class="n">${esc(f.name)}</div>
        <div class="d">大人${f.adults||0}・小孩${f.kids||0}${f.pets?"・寵物"+f.pets:""}${f.roomType?"・"+esc(f.roomType):""}${f.roomFee?"・房費"+f.roomFee:""}</div>
      </div>
      <div style="display:flex">
        <button class="iconbtn editFam" data-id="${f.id}"><span class="msi">edit</span></button>
        <button class="iconbtn delFam" data-id="${f.id}"><span class="msi">delete</span></button>
      </div>
    </div>`).join("") || `<div class="empty" style="padding:20px 0">還沒有家庭，先新增一個</div>`;

  root.innerHTML = `
    <div class="card">
      <div style="font-weight:700;margin-bottom:6px">活動資訊</div>
      <div style="font-size:13px;color:var(--ink-dim);line-height:2">
        <span class="msi" style="font-size:16px">location_on</span> ${esc(e.venue?.name || "—")}<br/>
        <span class="msi" style="font-size:16px">calendar_month</span> ${e.checkIn ? esc(e.checkIn) : "日期未定"}${e.checkOut ? " ～ "+esc(e.checkOut) : ""}
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="num">${families.length}</div><div class="lbl">家庭</div></div>
        <div class="stat"><div class="num">${totals.adults}</div><div class="lbl">大人</div></div>
        <div class="stat"><div class="num">${totals.kids}</div><div class="lbl">小孩</div></div>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <div style="font-weight:700">家庭名單</div>
        <button class="iconbtn" id="addFam"><span class="msi">person_add</span></button>
      </div>
      ${famRows}
    </div>
  `;
  document.getElementById("addFam").onclick = ()=> openFamilyModal(null);
  root.querySelectorAll(".editFam").forEach(b=> b.onclick = ()=> openFamilyModal(families.find(f=>f.id===b.dataset.id)));
  root.querySelectorAll(".delFam").forEach(b=> b.onclick = ()=> deleteFamily(b.dataset.id));
}

function openFamilyModal(fam){
  const isNew = !fam;
  root_showModal(`
    <h3>${isNew ? "新增家庭" : "編輯家庭"}</h3>
    <div class="field"><label>家庭名稱</label><input id="fName" value="${esc(fam?.name||"")}" placeholder="例：阿彬家" /></div>
    <div class="row">
      <div class="field"><label>大人</label><input id="fAdults" type="number" min="0" value="${fam?.adults??0}" /></div>
      <div class="field"><label>小孩</label><input id="fKids" type="number" min="0" value="${fam?.kids??0}" /></div>
      <div class="field"><label>寵物</label><input id="fPets" type="number" min="0" value="${fam?.pets??0}" /></div>
    </div>
    <div class="row">
      <div class="field"><label>房型</label><input id="fRoomType" value="${esc(fam?.roomType||"")}" /></div>
      <div class="field"><label>房費</label><input id="fRoomFee" type="number" min="0" value="${fam?.roomFee??""}" /></div>
    </div>
    <div class="field"><label>備註</label><input id="fNote" value="${esc(fam?.note||"")}" /></div>
    <button class="btn block" id="saveFam">${isNew ? "新增" : "儲存"}</button>
  `);
  document.getElementById("saveFam").onclick = async ()=>{
    const name = document.getElementById("fName").value.trim();
    if(!name){ toast("請填家庭名稱"); return; }
    const data = {
      name,
      adults: Number(document.getElementById("fAdults").value)||0,
      kids: Number(document.getElementById("fKids").value)||0,
      pets: Number(document.getElementById("fPets").value)||0,
      roomType: document.getElementById("fRoomType").value.trim(),
      roomFee: Number(document.getElementById("fRoomFee").value)||0,
      note: document.getElementById("fNote").value.trim(),
    };
    if(isNew) await addDoc(collection(db, `events/${currentEvent.id}/families`), data);
    else await updateDoc(doc(db, `events/${currentEvent.id}/families/${fam.id}`), data);
    toast("已儲存"); closeModal();
  };
}
async function deleteFamily(id){
  if(!confirm("確定要刪除這個家庭嗎？（連同他的認領一起會留著，不會自動清除）")) return;
  await deleteDoc(doc(db, `events/${currentEvent.id}/families/${id}`));
}

// ---------- 身分比對／選擇 ----------
function myFamilyInEvent(){
  const name = getMyFamilyName();
  return families.find(f=>f.name===name) || null;
}
function ensureIdentityThen(cb){
  const mine = myFamilyInEvent();
  if(mine){ cb(mine); return; }
  openIdentityPicker(()=>{
    const mine2 = myFamilyInEvent();
    if(mine2) cb(mine2);
    else toast("這個名稱還不在家庭名單裡，先去總覽新增這個家庭");
  });
}
function openIdentityPicker(onDone){
  const opts = families.map(f=>`<label class="opt"><input type="radio" name="famPick" value="${esc(f.name)}"/> ${esc(f.name)}</label>`).join("");
  root_showModal(`
    <h3>你是哪一家？</h3>
    <div class="fam-picker">${opts || `<div class="empty">這個活動還沒有家庭名單，先到總覽新增</div>`}</div>
    <div class="field" style="margin-top:12px"><label>或輸入名稱（若不在名單中）</label><input id="newFamName" placeholder="例：阿彬家"/></div>
    <button class="btn block" id="confirmIdentity">確定</button>
  `);
  document.getElementById("confirmIdentity").onclick = ()=>{
    const checked = document.querySelector('input[name="famPick"]:checked');
    const typed = document.getElementById("newFamName").value.trim();
    const name = typed || (checked && checked.value);
    if(!name){ toast("請選一個或輸入名稱"); return; }
    setMyFamilyName(name);
    updateMeBadge();
    closeModal();
    onDone && onDone();
  };
}
function updateMeBadge(){
  const name = getMyFamilyName();
  meBadge.textContent = name ? "身分："+name : "設定身分";
}
meBadge.onclick = ()=>{
  if(currentEvent){
    openIdentityPicker(()=> renderActiveTab());
  } else {
    const name = prompt("輸入你的家庭名稱：", getMyFamilyName());
    if(name){ setMyFamilyName(name); updateMeBadge(); }
  }
};

// ---------- 4.4 清單認領 ----------
function renderClaimsTab(){
  const mine = myFamilyInEvent();
  const famName = id => families.find(f=>f.id===id)?.name || "?";

  const withClaims = items.map(it=>{
    const itClaims = claims.filter(c=>c.itemId===it.id);
    const claimedQty = itClaims.reduce((s,c)=>s+(Number(c.qty)||0),0);
    return {...it, itClaims, claimedQty, remaining: Math.max(0,(it.qtyNeeded||0)-claimedQty)};
  });

  const filtered = withClaims.filter(it=>{
    if(claimFilter==="need") return it.remaining>0;
    if(claimFilter==="mine") return mine && it.itClaims.some(c=>c.familyId===mine.id);
    return true;
  });

  const fullCount = withClaims.filter(it=>it.remaining<=0 && it.claimedQty>0).length;
  const needCount = withClaims.filter(it=>it.remaining>0).length;

  const byCat = {};
  filtered.forEach(it=>{ (byCat[it.categoryId] ??= []).push(it); });

  const catBlocks = categories
    .filter(c=> byCat[c.id]?.length)
    .map(c=>{
      const rows = byCat[c.id].map(it=>{
        const statusClass = it.claimedQty<=0 ? "none" : (it.remaining>0 ? "partial" : "full");
        const mineHasClaim = mine && it.itClaims.some(c2=>c2.familyId===mine.id);
        const tags = it.itClaims.map(c2=>
          `<span class="tag ${mine && c2.familyId===mine.id ? "mine" : ""}">${esc(famName(c2.familyId))} ×${c2.qty}</span>`
        ).join("");
        return `<div class="item-card">
          <div class="top">
            <div class="name"><span class="status-dot ${statusClass}"></span>${esc(it.name)}${it.note?`<div style="font-weight:400;font-size:11px;color:var(--ink-dim)">${esc(it.note)}</div>`:""}</div>
            <div class="qty">${it.claimedQty}/${it.qtyNeeded} ${esc(it.unit||"")}</div>
          </div>
          ${tags ? `<div class="claimants">${tags}</div>` : ""}
          <div class="actions">
            <button class="btn secondary claimBtn" data-id="${it.id}" style="flex:1">${mineHasClaim ? "修改我的認領" : "我認領"}</button>
          </div>
        </div>`;
      }).join("");
      return `<div class="cat-title">${esc(c.name)}</div>${rows}`;
    }).join("") || `<div class="empty">沒有符合條件的項目</div>`;

  root.innerHTML = `
    <div class="summary-bar"><span>共 ${items.length} 項</span><span>已滿足 ${fullCount} 項</span><span>還缺 ${needCount} 項</span></div>
    <div class="chips">
      <button class="chip ${claimFilter==='all'?'active':''}" data-f="all">全部</button>
      <button class="chip ${claimFilter==='need'?'active':''}" data-f="need">還缺的</button>
      <button class="chip ${claimFilter==='mine'?'active':''}" data-f="mine">我認領的</button>
    </div>
    ${catBlocks}
  `;
  root.querySelectorAll(".chip").forEach(b=> b.onclick = ()=>{ claimFilter = b.dataset.f; renderClaimsTab(); });
  root.querySelectorAll(".claimBtn").forEach(b=>{
    b.onclick = ()=> ensureIdentityThen(fam=> openClaimModal(items.find(i=>i.id===b.dataset.id), fam));
  });
}

function openClaimModal(item, fam){
  const itClaims = claims.filter(c=>c.itemId===item.id);
  const claimedQty = itClaims.reduce((s,c)=>s+(Number(c.qty)||0),0);
  const mineClaim = itClaims.find(c=>c.familyId===fam.id);
  const othersQty = claimedQty - (mineClaim ? Number(mineClaim.qty)||0 : 0);
  const remaining = Math.max(0, (item.qtyNeeded||0) - othersQty);
  const defaultQty = mineClaim ? mineClaim.qty : (remaining>0 ? remaining : 1);

  root_showModal(`
    <h3>${esc(item.name)}</h3>
    <div style="font-size:13px;color:var(--ink-dim);margin-bottom:10px">需要 ${item.qtyNeeded} ${esc(item.unit||"")}，目前已認領 ${claimedQty}</div>
    <div class="field"><label>我認領（${esc(item.unit||"")}）</label><input id="claimQty" type="number" min="0" value="${defaultQty}" /></div>
    <div class="row">
      <button class="btn block" id="saveClaim">${mineClaim ? "更新" : "確定認領"}</button>
      ${mineClaim ? `<button class="btn secondary block" id="cancelClaim">取消認領</button>` : ""}
    </div>
  `);
  document.getElementById("saveClaim").onclick = async ()=>{
    const qty = Number(document.getElementById("claimQty").value);
    if(!qty || qty<=0){ toast("請輸入數量"); return; }
    if(othersQty + qty > item.qtyNeeded) toast("超過需求量了，還是先幫你記錄");
    if(mineClaim){
      await updateDoc(doc(db, `events/${currentEvent.id}/claims/${mineClaim.id}`), {qty});
    } else {
      await addDoc(collection(db, `events/${currentEvent.id}/claims`), {
        itemId: item.id, familyId: fam.id, qty, done:false, createdAt: serverTimestamp()
      });
    }
    toast("已認領"); closeModal();
  };
  if(mineClaim){
    document.getElementById("cancelClaim").onclick = async ()=>{
      await deleteDoc(doc(db, `events/${currentEvent.id}/claims/${mineClaim.id}`));
      toast("已取消認領"); closeModal();
    };
  }
}

let modalMask;
function root_showModal(innerHtml){
  closeModal();
  modalMask = document.createElement("div");
  modalMask.className = "modal-mask";
  modalMask.innerHTML = `<div class="modal">${innerHtml}</div>`;
  modalMask.addEventListener("click", (ev)=>{ if(ev.target===modalMask) closeModal(); });
  document.body.appendChild(modalMask);
}
function closeModal(){ if(modalMask){ modalMask.remove(); modalMask=null; } }

// ---------- 啟動 ----------
let allEvents = [];
function boot(){
  updateMeBadge();

  onSnapshot(query(collection(db,"events")), (snap)=>{
    allEvents = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(!currentEvent){
      renderEventList(allEvents);
    } else {
      const updated = allEvents.find(e=>e.id===currentEvent.id);
      if(updated){
        currentEvent = updated;
        topTitle.textContent = `${updated.year} ${updated.venue?.name || ""}`;
        if(currentTab==="overview") renderActiveTab();
      }
    }
  }, (err)=>{
    console.error(err);
    root.innerHTML = `<div class="empty">讀取失敗，可能是 Firestore 權限規則尚未開放。<br/>
      <span style="font-size:12px">${err.message}</span></div>`;
  });
}
boot();
</script>
</body>
